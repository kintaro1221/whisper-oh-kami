name: notices-check

# Release gate: THIRD_PARTY_NOTICES.md must regenerate to 0
# "License text not found" entries from the current production
# dependency tree AND be byte-identical to the committed file. The
# script scripts/generate-notices.js + MANUAL_LICENSE_TEXTS fallback
# is the authoritative content gate; the post-step `git diff
# --exit-code` is the staleness gate.
#
# Why both gates: `npm run notices:check` only fails when the new
# tree has missing license text. It does NOT fail when the tree
# rendered into THIRD_PARTY_NOTICES.md differs from the committed
# file — a lockfile regen once drifted ~18 lines while notices:check
# still exited 0, i.e. a silent stale-doc regression. The post-
# generator `git diff` step below closes that hole.
#
# The cron is kept as a runner/tooling sanity check even though npm
# tarball drift is already prevented by integrity sums in
# package-lock.json.

on:
    pull_request:
        paths:
            - 'package.json'
            - 'package-lock.json'
            - 'npm-shrinkwrap.json'
            - '.npmrc'
            - 'scripts/generate-notices.js'
            - 'scripts/notice-inventory.js'
            - 'scripts/licenses/**'
            - 'native/daddy-audio-capture/Cargo.lock'
            - 'native/daddy-audio-capture/Cargo.toml'
            - 'forge.config.js'
            - 'THIRD_PARTY_NOTICES.md'
            - '.github/workflows/notices-check.yml'
    push:
        branches:
            - main
    schedule:
        # Weekly Monday 00:30 UTC, 30 min offset from audit-prod so the
        # two cron jobs do not contend for the runner.
        - cron: '30 0 * * 1'

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    notices-check:
        # Match the distributed platform's installed optional native packages.
        runs-on: windows-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            # --ignore-scripts because the notices generator only reads LICENSE
            # files; no native rebuild is required for this gate.
            - name: Clean install (npm ci --ignore-scripts)
              run: npm ci --ignore-scripts

            - name: Fetch locked Rust license sources (no compilation)
              run: cargo fetch --locked --manifest-path native/daddy-audio-capture/Cargo.toml

            - name: Regenerate notices and fail on missing license text
              run: npm run notices:check

            # Catch the case where notices:check succeeds (no missing license
            # texts) but the regenerated content differs from the committed
            # file. Without this step the gate is false-green any time a
            # transitive dep version changes through a lockfile bump.
            - name: Verify committed THIRD_PARTY_NOTICES.md is current
              shell: bash
              run: |
                  if ! git diff --exit-code -- THIRD_PARTY_NOTICES.md; then
                    echo ""
                    echo "::error::THIRD_PARTY_NOTICES.md is out of date."
                    echo "Run \`npm run notices\` locally and commit the regenerated file."
                    exit 1
                  fi

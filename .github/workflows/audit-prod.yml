name: audit-prod

# B1 acceptance gate (docs/launch/npm-audit-triage.md "Soft gate"):
# Runtime npm dependencies must report 0 critical and 0 high
# advisories. devDependencies (Electron toolchain) are intentionally
# OUT of scope here — they are tracked separately for B1 Electron 42
# upgrade. The qualifier "Runtime npm dependencies (--omit=dev): 0 /
# Full build/test dependency tree: 54 findings" comes from codex
# Track A round-5 verify §1.
#
# We use `--audit-level=high` so the gate fires on critical+high
# but lets moderate/low through (those are tracked manually).
#
# NOTE on framing: this gate fires on ANY current critical/high in
# the production dep tree, NOT just newly-introduced advisories.
# There is no baseline-diff. A new CVE published against an already-
# pinned version will start failing PRs the next time this workflow
# runs. That is intentional — silence on a known critical is worse
# than churn.
#
# Self-review (workflow wf_32ebedb1-58d) added:
#   - forge.config.js + .npmrc + npm-shrinkwrap.json to `paths`
#   - permissions / timeout-minutes / concurrency hardening
#   - `npm audit --json | jq` for a reliable step-summary count
#     (the previous `npm audit 2>&1 | tail -1` captured a hint
#     line, not the breakdown)

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - '.npmrc'
      - 'forge.config.js'
      - '.github/workflows/audit-prod.yml'
  push:
    branches:
      - main
  schedule:
    # Weekly Monday 00:00 UTC. Catches new advisories on already-pinned
    # versions even when no PR is open. notices-check runs at 00:30 to
    # avoid runner contention.
    - cron: '0 0 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # --ignore-scripts because `npm audit` reads the lockfile; we do
      # not need native modules built for this gate.
      - name: Clean install (npm ci --ignore-scripts)
        run: npm ci --ignore-scripts

      - name: Audit runtime production dependencies (fail on critical/high)
        run: npm audit --omit=dev --audit-level=high

      # Codex round-6 verify P1-1: render the full-tree audit count
      # breakdown via Node's JSON parser instead of `jq` + a
      # generic-`tail` fallback. The `tail -3` fallback in the
      # previous revision captured `npm audit`'s hint line ("Some
      # issues need review, ...") instead of any count summary, so
      # the step summary was effectively empty whenever jq was
      # absent. Using `node` here ensures the breakdown is rendered
      # on any runner Node 20+ ships on (which includes
      # ubuntu-latest as well as any custom runner) and removes the
      # silent-fallback failure mode entirely.
      - name: Record full-tree audit summary (informational, never fails)
        if: always()
        shell: bash
        run: |
          npm audit --json > /tmp/full-audit.json 2>/dev/null || true
          node - >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require('node:fs');
          let summary;
          try {
            const a = JSON.parse(fs.readFileSync('/tmp/full-audit.json', 'utf8'));
            summary = a.metadata && a.metadata.vulnerabilities;
          } catch (err) {
            summary = null;
          }
          const lines = [
            '## Full-tree npm audit (informational)',
            '',
            'Includes devDependencies + Electron toolchain. The PR-blocking gate above only fails on runtime production critical/high; the numbers below are for tracking, not blocking.',
            '',
            '```json',
            summary
              ? JSON.stringify(summary, null, 2)
              : '{ "error": "could not parse `npm audit --json` output" }',
            '```',
            '',
            '(devDependencies / Electron toolchain advisories are tracked in docs/launch/npm-audit-triage.md, not blocked here. Re-evaluate when Electron 42 + Forge 7.11 land in B1.)',
          ];
          process.stdout.write(lines.join('\n') + '\n');
          NODE

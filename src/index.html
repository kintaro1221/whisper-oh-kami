<!doctype html>
<html>
    <head>
        <meta http-equiv="content-security-policy" content="script-src 'self' 'unsafe-inline'" />
        <title>WhisperOhKAMI</title>
        <style>
            @font-face {
                font-family: 'Noto Sans JP';
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url('assets/fonts/NotoSansJP-Regular.woff2') format('woff2');
            }
            @font-face {
                font-family: 'Noto Sans JP';
                font-style: normal;
                font-weight: 500;
                font-display: swap;
                src: url('assets/fonts/NotoSansJP-Medium.woff2') format('woff2');
            }
            @font-face {
                font-family: 'Noto Sans JP';
                font-style: normal;
                font-weight: 700;
                font-display: swap;
                src: url('assets/fonts/NotoSansJP-Bold.woff2') format('woff2');
            }

            :root {
                /* Backgrounds */
                --bg-app: #ffffff;
                --bg-surface: #f4f6f8;
                --bg-elevated: #eef1f4;
                --bg-hover: #e8ebef;

                /* Text */
                --text-primary: #1a1f2e;
                --text-secondary: #5a6573;
                --text-muted: #5e6773;

                /* Borders & Lines */
                --border: #e3e7eb;
                --border-strong: #d3dae1;

                /* Accent */
                --accent: #1f3a5f;
                --accent-hover: #2c4f7c;

                /* Status */
                --success: #1f9d57;
                --warning: #a87a1a;
                --danger: #d64545;

                /* Typography */
                --font: 'Noto Sans JP', system-ui, sans-serif;
                --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
                --font-size-xs: 11px;
                --font-size-sm: 13px;
                --font-size-base: 14px;
                --font-size-lg: 16px;
                /* Header sizes scale slightly with viewport width — body sizes
                   stay fixed for stable legibility. clamp(min, fluid, max)
                   floors at narrow windows so headings don't collapse. */
                --font-size-xl: clamp(18px, 2.2vw, 20px);
                --font-size-2xl: clamp(22px, 3.5vw, 28px);
                --font-weight-normal: 400;
                --font-weight-medium: 500;
                --font-weight-semibold: 600;
                --line-height: 1.6;
                /* JP の本文・説明文に明示的に当てる「読み」用 line-height。
                   全体既定 1.6 はそのまま、長文だけ 1.7 にして読みやすさを足す。 */
                --line-height-reading: 1.7;
                /* 見出し用、行間を絞る。20px+ 見出しを 1.6 で組むと間延びするので 1.45。 */
                --line-height-tight: 1.45;

                /* Spacing */
                --space-xs: 4px;
                --space-sm: 8px;
                --space-md: 16px;
                --space-lg: 24px;
                --space-xl: 40px;
                --space-2xl: 64px;

                /* Radius */
                --radius-sm: 4px;
                --radius-md: 8px;
                --radius-lg: 12px;

                /* Transitions */
                --transition: 150ms ease;

                /* Sidebar — flexes between 180 (cramped but text-readable) and 220.
                   Below 820px the icon-only collapse via @media kicks in
                   (see CheatingDaddyApp .sidebar styles). */
                --sidebar-width: clamp(180px, 20vw, 220px);
                --sidebar-width-collapsed: 60px;

                /* Legacy compatibility — mapped to new tokens */
                --background-transparent: transparent;
                --bg-primary: var(--bg-app);
                --bg-secondary: var(--bg-surface);
                --bg-tertiary: var(--bg-elevated);
                --text-color: var(--text-primary);
                --description-color: var(--text-secondary);
                --placeholder-color: var(--text-muted);
                --border-color: var(--border);
                --border-subtle: var(--border);
                --border-default: var(--border-strong);
                --header-background: var(--bg-surface);
                --header-actions-color: var(--text-secondary);
                --main-content-background: var(--bg-app);
                --button-background: transparent;
                --button-border: var(--border-strong);
                --icon-button-color: var(--text-secondary);
                --hover-background: var(--bg-hover);
                --input-background: var(--bg-elevated);
                --input-focus-background: var(--bg-elevated);
                --focus-border-color: var(--accent);
                --focus-box-shadow: transparent;
                --scrollbar-track: var(--bg-app);
                --scrollbar-thumb: var(--border-strong);
                --scrollbar-thumb-hover: #444444;
                --scrollbar-background: var(--bg-app);
                --start-button-background: var(--accent);
                --start-button-color: #ffffff;
                --start-button-border: var(--accent);
                --start-button-hover-background: var(--accent-hover);
                --start-button-hover-border: var(--accent-hover);
                --text-input-button-background: var(--accent);
                --text-input-button-hover: var(--accent-hover);
                --link-color: var(--accent);
                --key-background: var(--bg-elevated);
                --success-color: var(--success);
                --warning-color: var(--warning);
                --error-color: var(--danger);
                --danger-color: var(--danger);
                --preview-video-background: var(--bg-surface);
                --preview-video-border: var(--border);
                --option-label-color: var(--text-primary);
                --screen-option-background: var(--bg-surface);
                --screen-option-hover-background: var(--bg-elevated);
                --screen-option-selected-background: var(--bg-hover);
                --screen-option-text: var(--text-secondary);

                /* Layout-specific */
                --header-padding: 8px 16px;
                --header-font-size: 14px;
                --header-gap: 8px;
                --header-button-padding: 6px 12px;
                --header-icon-padding: 6px;
                --header-font-size-small: 12px;
                --main-content-padding: 16px;
                --main-content-margin-top: 0;
                --icon-size: 18px;
                --border-radius: var(--radius-sm);
                --content-border-radius: 0;
            }

            html {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
                border-radius: 12px;
                background: transparent;
            }

            body {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
                background: var(--bg-app);
                color: var(--text-primary);
                line-height: var(--line-height);
                border-radius: 12px;
                border: 1px solid var(--border);
                font-family: var(--font);
                font-size: var(--font-size-base);
                font-weight: var(--font-weight-normal);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                /* JP 向けタイポ作り込み (invisible polish):
                   - palt: 半角括弧・句読点の前後余白を詰める (proportional alternate width)
                   - tnum: 数字を等幅に (tabular numerals)、X / 5 等のカウンタが揃う
                   - kern: 自動 kerning 有効化 */
                font-feature-settings: 'palt' 1, 'tnum' 1, 'kern' 1;
                text-rendering: optimizeLegibility;
            }

            * {
                box-sizing: border-box;
            }

            :focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }

            ::-webkit-scrollbar-track {
                background: transparent;
            }

            ::-webkit-scrollbar-thumb {
                background: var(--border-strong);
                border-radius: 3px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: #444444;
            }

            whisper-oh-kami-app {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <script src="assets/marked-4.3.0.min.js"></script>
        <script src="assets/highlight-11.9.0.min.js"></script>
        <link rel="stylesheet" href="assets/highlight-vscode-dark.min.css" />
        <script src="utils/evidenceInspector.js"></script>
        <script src="utils/discoveryPhase.js"></script>
        <script src="utils/whisperBarState.js"></script>
        <script type="module" src="components/app/CheatingDaddyApp.js"></script>

        <whisper-oh-kami-app></whisper-oh-kami-app>
        <script src="script.js"></script>
        <script src="utils/renderer.js"></script>
    </body>
</html>
